<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Monday 업무 자동화의 실행 조건과 판단 기준을 살펴보는 흐름도">
    <title>Monday 자동화 흐름</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell" id="app">
      <aside class="sidebar" aria-label="다이어그램 탐색">
        <div class="sidebar__brand">
          <p class="eyebrow">MONDAY AUTOMATION</p>
          <h1>Monday 자동화 흐름</h1>
          <p class="sidebar__lede">실행 조건 · 판단 기준 · 업무 결과</p>
        </div>

        <nav class="diagram-nav" aria-label="다이어그램 목록">
          <div class="nav-toolbar" id="navToolbar" hidden>
            <div class="nav-toolbar__copy">
              <span class="nav-toolbar__label" id="navFilterLabel">필터 결과</span>
              <strong class="nav-toolbar__count" id="navFilterCount"></strong>
            </div>
            <button id="navClearFilter" class="text-button" type="button">전체 보기</button>
          </div>
          <div id="diagramNavList" class="diagram-nav__list"></div>
        </nav>

        <div class="sidebar__footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="dataStatus">원본 불러오는 중</span>
        </div>
      </aside>

      <main class="main-content">
        <header class="main-header">
          <div class="main-header__top">
            <div class="main-header__copy">
              <p class="eyebrow eyebrow--main" id="diagramKicker">전체 구조</p>
              <div class="title-row">
                <button id="backButton" class="back-button" type="button" hidden>전체 구조로</button>
                <h2 id="diagramTitle">다이어그램을 불러오는 중</h2>
              </div>
              <p id="diagramPath" class="diagram-path"></p>
            </div>
          </div>

          <section id="relatedBoardsSection" class="related-boards" aria-label="관련 보드" hidden>
            <h3 class="related-boards__title">이 흐름의 보드</h3>
            <div id="relatedBoardList" class="chip-list chip-list--lg"></div>
          </section>

          <section id="overviewLegend" class="overview-legend" aria-label="보드 색 범례" hidden>
            <h3 class="related-boards__title">보드 색 범례</h3>
            <div id="legendList" class="chip-list chip-list--lg"></div>
          </section>
        </header>

        <section class="diagram-panel" aria-labelledby="diagramTitle">
          <div class="diagram-panel__bar">
            <div id="diagramStatus" class="diagram-status" role="status" aria-live="polite">렌더링 준비 중</div>
            <p id="diagramHint" class="diagram-hint">파일 노드를 클릭하면 상세로 이동합니다</p>
          </div>
          <div id="diagramError" class="diagram-error" role="alert" hidden></div>
          <div id="diagramViewport" class="diagram-viewport">
            <div id="diagramMount" class="diagram-mount"></div>
          </div>
          <div class="title-block" aria-hidden="true">
            <div class="title-block__cell">
              <span class="title-block__label">업무</span>
              <span id="titleBlockFile" class="title-block__value">—</span>
            </div>
            <div class="title-block__cell">
              <span class="title-block__label">단계</span>
              <span id="titleBlockNodes" class="title-block__value">—</span>
            </div>
            <div class="title-block__cell">
              <span class="title-block__label">관련 보드</span>
              <span id="titleBlockBoard" class="title-block__value">—</span>
            </div>
            <div class="title-block__cell">
              <span class="title-block__label">표시 상태</span>
              <span id="titleBlockStatus" class="title-block__value">—</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/vendor/mermaid.min.js"></script>
    <script src="/boards.config.js"></script>
    <script type="module">
      function showLoadError(detail) {
        const status = document.querySelector('#diagramStatus');
        const errorBox = document.querySelector('#diagramError');
        status.textContent = '뷰어 초기화 실패';
        errorBox.hidden = false;
        errorBox.textContent = `뷰어 스크립트를 불러오지 못했습니다: ${detail}`;
      }

      try {
        if (!window.mermaid) {
          throw new Error('public/vendor/mermaid.min.js 로드 실패');
        }
        await import('./app.js');
      } catch (error) {
        showLoadError(error && error.message ? error.message : String(error));
      }
    </script>
  </body>
</html>
